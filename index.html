<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI CCTV Sekolah</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#07111f;
    color:#eaf2ff;
}


/* =====================================================
   LOGIN
===================================================== */

#loginPage{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(
            circle at top,
            #173b61,
            #07111f 55%,
            #02060d
        );
}

.login-box{
    width:430px;
    max-width:100%;

    padding:32px;

    background:#0d1b2d;

    border:1px solid #294866;

    border-radius:24px;

    box-shadow:
        0 30px 80px #000b;
}

.login-logo{
    width:72px;
    height:72px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#2563eb;

    font-size:35px;
}

.login-box h1{
    text-align:center;

    margin-top:18px;

    font-size:25px;
}

.login-description{
    text-align:center;

    color:#8197b0;

    margin-top:8px;
    margin-bottom:25px;

    font-size:14px;
}

.role-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-bottom:20px;
}

.role-buttons button{
    padding:13px;

    border-radius:10px;

    border:1px solid #294561;

    background:#101f34;

    color:#9fb1c7;

    cursor:pointer;
}

.role-buttons button.active{
    background:#2563eb;

    color:white;

    border-color:#3d7cf0;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;

    margin-bottom:7px;

    color:#93a8c0;

    font-size:13px;
}

input,
select{
    width:100%;

    padding:13px;

    background:#071423;

    color:white;

    border:1px solid #294663;

    border-radius:10px;

    outline:none;
}

input:focus,
select:focus{
    border-color:#3b82f6;
}

.login-button{
    width:100%;

    padding:14px;

    border:0;

    border-radius:10px;

    background:#16a34a;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.login-button:hover{
    background:#15803d;
}

.login-info{
    margin-top:17px;

    padding:12px;

    background:#081525;

    border-radius:9px;

    text-align:center;

    color:#71869e;

    font-size:12px;

    line-height:1.6;
}


/* =====================================================
   APP
===================================================== */

#app{
    display:none;

    min-height:100vh;
}

.topbar{
    height:72px;

    padding:0 25px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:#0b192b;

    border-bottom:1px solid #223b58;
}

.brand{
    display:flex;

    align-items:center;

    gap:12px;
}

.brand-icon{
    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#2563eb;

    font-size:22px;
}

.brand-name{
    font-weight:bold;
}

.brand-subtitle{
    display:block;

    margin-top:3px;

    color:#7288a2;

    font-size:11px;
}

.user-area{
    display:flex;

    align-items:center;

    gap:10px;
}

.role-badge{
    padding:8px 12px;

    border-radius:20px;

    font-size:11px;

    font-weight:bold;
}

.role-student{
    color:#60a5fa;

    background:#102f68;
}

.role-teacher{
    color:#ff6c75;

    background:#54131a;
}

.logout-button{
    padding:9px 13px;

    border:1px solid #512d32;

    border-radius:8px;

    background:#211519;

    color:#ff8790;

    cursor:pointer;
}


/* =====================================================
   MAIN
===================================================== */

.container{
    max-width:1450px;

    margin:auto;

    padding:25px;
}

.page-heading{
    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    margin-bottom:22px;
}

.page-heading h1{
    font-size:29px;
}

.page-heading p{
    color:#7d94ae;

    margin-top:6px;

    font-size:14px;
}

.system-status{
    padding:10px 15px;

    border-radius:20px;

    background:#06321d;

    color:#46db84;

    border:1px solid #0b6338;

    font-size:12px;
}


/* =====================================================
   STATISTICS
===================================================== */

.stats{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;

    margin-bottom:22px;
}

.stat{
    padding:18px;

    border-radius:16px;

    background:#0d1d31;

    border:1px solid #233d5a;
}

.stat-title{
    color:#849ab3;

    font-size:12px;
}

.stat-number{
    margin-top:8px;

    font-size:30px;

    font-weight:bold;
}

.blue{
    color:#60a5fa;
}

.red{
    color:#ff6871;
}

.green{
    color:#4ade80;
}

.yellow{
    color:#facc15;
}


/* =====================================================
   SECTION
===================================================== */

.section{
    margin-bottom:22px;

    overflow:hidden;

    border-radius:18px;

    background:#0c1a2c;

    border:1px solid #223b58;
}

.section-header{
    padding:17px 20px;

    display:flex;

    justify-content:space-between;

    border-bottom:1px solid #223a56;
}

.section-header span{
    color:#7289a4;

    font-size:12px;
}


/* =====================================================
   CLASSROOM
===================================================== */

.classroom{
    position:relative;

    height:680px;

    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            #ffffff04 1px,
            transparent 1px
        ),
        linear-gradient(
            #ffffff04 1px,
            transparent 1px
        ),
        #102034;

    background-size:35px 35px;
}


/* papan tulis */

.board{
    position:absolute;

    top:25px;
    left:30px;
    right:180px;

    height:65px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:2px solid #355979;

    border-radius:8px;

    background:#14304a;

    color:#90a9c2;

    font-size:13px;
}


/* =====================================================
   GURU DI DEPAN
===================================================== */

.teacher-zone{
    position:absolute;

    top:105px;
    right:35px;

    width:105px;
    height:120px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    border:1px solid #74363c;

    border-radius:12px;

    background:#281922;
}

.teacher-character{
    position:relative;

    width:35px;
    height:65px;
}

.teacher-character .head{
    width:22px;
    height:22px;

    margin:auto;

    background:#b8c3ce;

    border-radius:4px;
}

.teacher-character .hair{
    position:absolute;

    top:0;
    left:7px;

    width:22px;
    height:8px;

    background:#202733;

    border-radius:4px;
}

.teacher-character .body{
    width:30px;
    height:32px;

    margin:4px auto;

    background:#d92d3a;

    border-radius:4px;
}

.teacher-zone small{
    color:#ff6973;

    font-size:10px;
}


/* =====================================================
   PINTU KANAN
===================================================== */

.door{
    position:absolute;

    top:255px;
    right:35px;

    width:75px;
    height:130px;

    display:flex;

    align-items:center;
    justify-content:center;

    writing-mode:vertical-rl;

    border:2px solid #425e78;

    border-radius:6px;

    background:#172b42;

    color:#91a5bc;

    font-size:11px;
}


/* =====================================================
   CAMERA MARKERS
===================================================== */

.camera-marker{
    position:absolute;

    z-index:10;

    width:40px;
    height:40px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#07111f;

    border:2px solid #60a5fa;

    box-shadow:
        0 0 14px #3287ff55;
}

.camera-1{
    top:108px;
    left:50%;

    transform:translateX(-50%);
}

.camera-2{
    top:50%;
    left:12px;
}

.camera-3{
    top:50%;
    right:12px;
}

.camera-4{
    bottom:15px;
    left:50%;

    transform:translateX(-50%);
}


/* =====================================================
   35 SISWA
===================================================== */

.students{
    position:absolute;

    top:180px;
    left:45px;
    right:120px;
    bottom:45px;

    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    grid-auto-rows:95px;

    gap:8px;
}

.student{
    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;
}


/* =====================================================
   AURA PIXEL SISWA
   BUKAN KOTAK
===================================================== */

.student::before{
    content:"";

    position:absolute;

    width:62px;
    height:75px;

    background:
        radial-gradient(
            ellipse,
            #3388ff42 0%,
            #3388ff20 35%,
            transparent 72%
        );

    filter:blur(2px);

    image-rendering:pixelated;
}


/* =====================================================
   KARAKTER SISWA
===================================================== */

.person{
    position:relative;

    z-index:2;

    width:32px;
    height:61px;
}


/* kepala */

.person .head{
    position:relative;

    width:20px;
    height:20px;

    margin:auto;

    background:#b7c3cf;

    border-radius:4px;
}


/* =====================================================
   RAMBUT SISWA LAKI-LAKI
===================================================== */

.male .hair{
    position:absolute;

    top:-2px;
    left:7px;

    width:20px;
    height:8px;

    background:#202832;

    border-radius:
        3px 3px 1px 1px;
}


/* =====================================================
   SISWI
===================================================== */

.female .hair{
    display:none;
}


/* =====================================================
   KERUDUNG PUTIH
===================================================== */

.female .head::before{
    content:"";

    position:absolute;

    top:-5px;
    left:-5px;

    width:30px;
    height:28px;

    background:#ffffff;

    border-radius:
        7px 7px 5px 5px;

    z-index:-1;
}


/* =====================================================
   SISWI NO 27 TANPA KERUDUNG
===================================================== */

.female.no-hijab .head::before{
    display:none;
}

.female.no-hijab .hair{
    display:block;

    position:absolute;

    top:-3px;
    left:5px;

    width:22px;
    height:15px;

    background:#202832;

    border-radius:
        5px 5px 3px 3px;
}


/* =====================================================
   KACAMATA NO 05
===================================================== */

.glasses{
    display:none;

    position:absolute;

    top:5px;
    left:4px;

    width:24px;
    height:7px;

    z-index:5;
}

.glasses::before,
.glasses::after{
    content:"";

    position:absolute;

    width:8px;
    height:6px;

    border:1px solid #e6edf5;

    border-radius:2px;
}

.glasses::before{
    left:0;
}

.glasses::after{
    right:0;
}

.has-glasses .glasses{
    display:block;
}


/* =====================================================
   SERAGAM
===================================================== */

.person .body{
    width:27px;
    height:29px;

    margin:3px auto 0;

    background:#eeeeee;

    border-radius:
        4px 4px 2px 2px;
}


/* =====================================================
   CELANA / ROK ABU
===================================================== */

.person .legs{
    width:22px;
    height:12px;

    margin:auto;

    background:#747c87;

    border-radius:2px;
}

.female .legs{
    width:26px;

    border-radius:
        2px 2px 6px 6px;
}


/* =====================================================
   NOMOR SISWA
===================================================== */

.student-number{
    position:absolute;

    bottom:1px;

    color:#738aa4;

    font-size:9px;
}


/* =====================================================
   LABEL AKTIVITAS
===================================================== */

.activity-label{
    position:absolute;

    bottom:-8px;

    color:#facc15;

    font-size:8px;

    opacity:0;
}

.active-phone .activity-label,
.active-chat .activity-label,
.active-walk .activity-label{
    opacity:1;
}


/* =====================================================
   AKTIVITAS HP
===================================================== */

.active-phone .person{
    animation:
        phoneMovement .9s infinite alternate;
}

@keyframes phoneMovement{

    from{
        transform:
            rotate(-2deg);
    }

    to{
        transform:
            rotate(3deg)
            translateY(-2px);
    }
}


/* =====================================================
   AKTIVITAS NGOBROL
===================================================== */

.active-chat .person{
    animation:
        chatMovement 1.2s infinite alternate;
}

@keyframes chatMovement{

    from{
        transform:
            translateX(-2px);
    }

    to{
        transform:
            translateX(2px);
    }
}


/* =====================================================
   AKTIVITAS BERGERAK
===================================================== */

.active-walk .person{
    animation:
        walkingMovement .6s infinite alternate;
}

@keyframes walkingMovement{

    from{
        transform:
            translateX(-8px);
    }

    to{
        transform:
            translateX(8px);
    }
}


/* =====================================================
   CCTV GRID
===================================================== */

.cctv-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    padding:17px;
}

.camera-card{
    overflow:hidden;

    border-radius:14px;

    background:#081525;

    border:1px solid #253f5c;
}

.camera-header{
    padding:13px 15px;

    display:flex;

    justify-content:space-between;

    border-bottom:1px solid #20374f;
}

.live-status{
    color:#42db81;

    font-size:11px;
}

.camera-view{
    position:relative;

    height:275px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        repeating-linear-gradient(
            0deg,
            #ffffff05 0px,
            #ffffff05 1px,
            transparent 1px,
            transparent 5px
        ),
        #101e30;
}

.camera-view.locked{
    background:#040912;
}


/* =====================================================
   CCTV LABEL
===================================================== */

.camera-label{
    position:absolute;

    top:12px;
    left:12px;

    z-index:5;

    padding:7px 10px;

    background:#030811cc;

    border-radius:6px;

    font-size:10px;
}

.live-dot{
    position:absolute;

    top:12px;
    right:12px;

    z-index:5;

    padding:7px 9px;

    background:#c9232e;

    border-radius:6px;

    font-size:10px;
}


/* =====================================================
   CCTV SCAN
===================================================== */

.scan-line{
    position:absolute;

    width:100%;
    height:2px;

    background:#3b9cff55;

    animation:
        scanning 3s linear infinite;
}

@keyframes scanning{

    from{
        top:0;
    }

    to{
        top:100%;
    }
}


/* =====================================================
   CCTV PIXEL PERSON
===================================================== */

.cctv-person{
    position:relative;

    width:42px;
    height:80px;
}

.cctv-person::before{
    content:"";

    position:absolute;

    width:70px;
    height:90px;

    left:-14px;
    top:-5px;

    background:
        radial-gradient(
            ellipse,
            #3388ff3b,
            #3388ff12,
            transparent 70%
        );
}

.cctv-person .head{
    position:relative;

    z-index:2;
}

.cctv-person .body{
    position:relative;

    z-index:2;

    width:30px;
    height:34px;

    margin:4px auto;

    background:#eeeeee;

    border-radius:4px;
}

.cctv-person .legs{
    position:relative;

    z-index:2;

    width:23px;
    height:13px;

    margin:auto;

    background:#737b86;
}


/* =====================================================
   AKSES TERBATAS
===================================================== */

.restricted{
    text-align:center;

    color:#53657a;
}

.restricted strong{
    display:block;

    margin-bottom:8px;

    color:#64758a;

    font-size:20px;
}


/* =====================================================
   CAMERA CONTROLS
===================================================== */

.camera-controls{
    display:flex;

    gap:8px;

    padding:12px;
}

.camera-controls button{
    flex:1;

    padding:10px;

    border:0;

    border-radius:8px;

    background:#2563eb;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.camera-controls .locked-button{
    background:#26364b;

    color:#71839a;

    cursor:not-allowed;
}


/* =====================================================
   WAKTU HABIS
===================================================== */

.expired-overlay{
    position:absolute;

    inset:0;

    z-index:20;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:#02050bd9;
}

.expired-overlay.show{
    display:flex;
}

.expired-overlay strong{
    display:block;

    margin-bottom:8px;

    color:#ff6872;

    font-size:25px;
}


/* =====================================================
   AKTIVITAS AI
===================================================== */

.activity-list{
    display:grid;

    gap:10px;

    padding:17px;
}

.activity-card{
    padding:15px;

    border-left:4px solid #22c55e;

    border-radius:8px;

    background:#13253c;
}

.activity-card.warning{
    border-left-color:#f59e0b;
}

.activity-card p{
    margin-top:5px;

    color:#849ab4;

    font-size:13px;
}


/* =====================================================
   SYSTEM LOG
===================================================== */

.system-log{
    padding:17px;
}

.log-item{
    display:flex;

    gap:12px;

    padding:13px 0;

    border-bottom:1px solid #20364e;
}

.log-icon{
    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:#152b45;
}

.log-item small{
    display:block;

    margin-top:4px;

    color:#7087a1;
}


/* =====================================================
   PLAYBACK
===================================================== */

#playbackSection{
    display:none;
}

.playback{
    padding:17px;
}

.video-placeholder{
    height:270px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:#03070d;

    color:#60748d;

    font-size:18px;
}

.timeline{
    height:7px;

    margin:17px 0;

    overflow:hidden;

    border-radius:10px;

    background:#26374c;
}

.timeline-progress{
    width:42%;
    height:100%;

    background:#2563eb;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .cctv-grid{
        grid-template-columns:1fr;
    }

    .students{
        grid-template-columns:repeat(5,1fr);
        left:25px;
        right:85px;
    }

}


@media(max-width:600px){

    .topbar{
        padding:0 12px;
    }

    .brand-subtitle{
        display:none;
    }

    .user-name{
        display:none;
    }

    .brand-name{
        font-size:13px;
    }

    .role-badge{
        padding:6px 9px;
        font-size:9px;
    }

    .logout-button{
        padding:7px 9px;
        font-size:10px;
    }

    .container{
        padding:10px;
    }


    /* JUDUL */

    .page-heading{
        display:block;
        margin-bottom:15px;
    }

    .page-heading h1{
        font-size:21px;
    }

    .page-heading p{
        font-size:11px;
    }

    .system-status{
        display:inline-block;
        margin-top:10px;
        font-size:9px;
    }


    /* STATISTIK */

    .stats{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .stat{
        padding:12px;
        border-radius:12px;
    }

    .stat-title{
        font-size:9px;
    }

    .stat-number{
        font-size:22px;
    }


    /* KELAS */

    .classroom{
        height:720px;
    }

    .board{
        top:15px;
        left:10px;
        right:80px;
        height:50px;
        font-size:10px;
    }

    .teacher-zone{
        top:80px;
        right:8px;
        width:62px;
        height:85px;
    }

    .teacher-zone small{
        font-size:7px;
    }

    .door{
        top:190px;
        right:8px;
        width:55px;
        height:95px;
        font-size:8px;
    }


    /* POSISI KAMERA */

    .camera-marker{
        width:30px;
        height:30px;
        font-size:11px;
    }

    .camera-1{
        top:80px;
    }

    .camera-2{
        left:5px;
    }

    .camera-3{
        right:5px;
    }

    .camera-4{
        bottom:10px;
    }


    /* 35 SISWA */

    .students{
        top:150px;
        left:8px;
        right:70px;
        bottom:25px;

        grid-template-columns:repeat(4,1fr);
        grid-auto-rows:92px;
        gap:3px;
    }

    .student::before{
        width:48px;
        height:60px;
    }

    .person{
        transform:scale(.78);
    }

    .student-number{
        font-size:7px;
    }

    .activity-label{
        font-size:6px;
    }


    /* CCTV */

    .section-header{
        padding:12px;
    }

    .section-header h2{
        font-size:14px;
    }

    .section-header span{
        font-size:9px;
    }

    .cctv-grid{
        padding:10px;
        gap:10px;
